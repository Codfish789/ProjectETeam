# Blowdryer settings version
gtnh.settings.blowdryerTag = 0.2.2

# ProjectE Team mod identity
modName = ProjectE Team
modId = ProjectETeam
modGroup = top.codfish.projecteteam

useModGroupForPublishing = true
autoUpdateBuildScript = false

# Minecraft / Forge versions
minecraftVersion = 1.7.10
forgeVersion = 10.13.4.1614
channel = stable
mappingsVersion = 12
remoteMappings = https\://raw.githubusercontent.com/MinecraftForge/FML/1.7.10/conf/

developmentEnvironmentUserName = Developer

# Modern Java syntax via Jabel (compile with Java 17+ syntax, output Java 8 bytecode)
enableModernJavaSyntax = jabel

# Generic injection for better IDE experience
enableGenericInjection = true

# Token class
generateGradleTokenClass = top.codfish.projecteteam.Tags
gradleTokenVersion = VERSION

# No mixins
usesMixins = false
usesShadowedDependencies = false

# Repositories
includeWellKnownRepositories = true

# Publishing
usesMavenPublishing = false
modrinthProjectId =
curseForgeProjectId =

# Build performance
org.gradle.configuration-cache = true
org.gradle.parallel = true
org.gradle.jvmargs = -Xmx4G
